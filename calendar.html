<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar Cozy Pixel Art</title>
    <link rel="stylesheet" href="styles/calendar.css">
    <script src="script/calendar.js" defer></script>
</head>
<body>
    <div id="container">
        <div id="header">
            <div id="monthDisplay"></div>
            <div id="buttons">
                <button id="backButton"></button>
                <button id="nextButton"></button>
            </div>
        </div>

        <div id="weekdays">
            <div>Sunday</div>
            <div>Monday</div>
            <div>Tuesday</div>
            <div>Wednesday</div>
            <div>Thursday</div>
            <div>Friday</div>
            <div>Saturday</div>
        </div>

        <div id="calendar">
        </div>
    </div>
</body>
</html>
